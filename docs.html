<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pawn Shop Kit Docs</title>
<meta name="description" content="Documentation for the Pawn Shop Kit: models, conventions, Unity, Godot and Unreal setup.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <a class="brand" href="./">Halfwatt Games</a>
    <nav><a href="./">Home</a><a href="docs.html">Docs</a><a href="./#support">Support</a></nav>
  </div>
</header>
<main class="wrap doc" id="doc"><p>Loading the documentation…</p></main>
<footer class="wrap foot">© 2026 Halfwatt Games</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
  // The page shows README.md, the same file that ships inside the package.
  fetch("README.md")
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(md => { document.getElementById("doc").innerHTML = marked.parse(md); })
    .catch(() => { document.getElementById("doc").innerHTML = '<p>Could not load the documentation. <a href="README.md">Open README.md</a>.</p>'; });
</script>
</body>
</html>
